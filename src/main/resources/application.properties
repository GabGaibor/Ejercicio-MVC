spring.application.name=minicore
server.port=${PORT:8080}

# Base de datos H2 en memoria (se recrea en cada arranque con data.sql)
spring.datasource.url=jdbc:h2:mem:minicore;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Consola H2 (util para mostrar las tablas en el video): /h2-console
spring.h2.console.enabled=true
